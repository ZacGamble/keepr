name: Build & Deploy

on:
  push:
    branches: [ main, master, deploy ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Client
        run: |
          cd keepr.client
          npm ci || npm install
          npm run build

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Backend (.NET)
        run: |
          dotnet restore keepr/keepr.csproj
          dotnet build keepr/keepr.csproj -c Release

      - name: Test Docker Container Build
        run: |
          docker build -t keepr:latest .

      - name: Trigger Render Deploy Webhook
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -X POST "$DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping deploy webhook trigger."
          fi